<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/"><link rel="stylesheet" href="power-level/style.css">
<style>body{margin:0;background:#101e26;color:#eee;font:14px sans-serif}*{box-sizing:border-box}nav{padding:12px;display:flex;gap:8px;flex-wrap:wrap}button,select{padding:8px}#powerLevel{min-height:0}output{display:block;padding:10px}</style>
<nav><label>Boost <select id="boost"><option value="1001">Small</option><option value="5001">Medium</option><option value="10000">Maximum</option></select></label><label>Starting altitude <select id="base"><option value="0">Foothills</option><option value=".19">Zone boundary</option><option value=".49">Middle mountain</option><option value=".8">Summit approach</option></select></label><label><input id="reduce" type="checkbox">Reduced motion</label><button id="start">Start</button><button id="middle">Midpoint</button><button id="end">End</button><button id="play">Play climb</button><button id="audit">Audit all frames</button></nav>
<div id="powerLevel"><div id="plStage" class="pl-stage"><div class="pl-arena"></div></div></div><output id="report"></output>
<script>
// Isolated visual fixture: no game state, persistence or production motion settings altered.
const nativeMedia=window.matchMedia.bind(window);window.matchMedia=q=>q==='(prefers-reduced-motion: reduce)'?{matches:document.querySelector('#reduce').checked}:nativeMedia(q);
</script><script src="power-level/scene.js"></script><script>
const stage=document.querySelector('#plStage'),scene=PowerLevelScene.create(stage),$=id=>document.getElementById(id);let raf=0;
function sample(t){const boost=+$('boost').value,base=+$('base').value,reduced=$('reduce').checked;const u=reduced?1:t;scene.update(Math.min(1,base+boost/50000*u*u*(3-2*u)),{t:u,boost});$('report').textContent=`${boost} boost · progress ${u} · frame ${document.querySelector('.pl-adventurer').dataset.frame}`;}
for(const [id,t] of [['start',0],['middle',.5],['end',1]])$(id).onclick=()=>{cancelAnimationFrame(raf);sample(t);};
$('play').onclick=()=>{cancelAnimationFrame(raf);const start=performance.now();function tick(now){const t=Math.min(1,(now-start)/1700);sample(t);if(t<1)raf=requestAnimationFrame(tick);}raf=requestAnimationFrame(tick);};
$('audit').onclick=()=>{cancelAnimationFrame(raf);let count=0,fail=[];for(const reduced of [false,true])for(const boost of ['1001','5001','10000'])for(const base of ['0','.19','.49','.8']){ $('reduce').checked=reduced;$('boost').value=boost;$('base').value=base;for(let i=0;i<=100;i++){sample(i/100);const s=stage.getBoundingClientRect(),c=document.querySelector('.pl-adventurer').getBoundingClientRect();if(c.left<s.left||c.right>s.right||c.top<s.top||c.bottom>s.bottom||document.querySelectorAll('.pl-adventurer').length!==1)fail.push({boost,base,i});count++;}}$('reduce').checked=false;sample(1);$('report').textContent=`${count} rendered samples; ${fail.length} bounds/count failures`;};sample(0);
</script>
